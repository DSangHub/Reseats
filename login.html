<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Reseats</title><style>body{font-family:system-ui;background:#fbf9f4;color:#1f2320;margin:0}main{max-width:420px;margin:8vh auto;padding:28px;background:white;border:1px solid #e6dfce;border-radius:16px}label{display:block;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:6px;font:inherit;border:1px solid #ccc;border-radius:8px}button{background:#2f9e7a;color:white;cursor:pointer}a{color:#22795d}.password{display:flex}.password button{width:auto;background:white;color:#22795d}#status{min-height:24px}button:disabled{opacity:.5}</style><main><a href="/">Reseats</a><h1 id="title">Sign in</h1><p>Open your scanner. Save receipt photos and find receipts by date or merchant.</p><form id="account"><div id="name-field" hidden><label for="name">Name</label><input id="name" autocomplete="name" maxlength="100"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><div class="password"><input id="password" type="password" required minlength="10" maxlength="128" autocomplete="current-password"><button id="show" type="button" aria-label="Show password">Show</button></div><button id="submit">Sign in & open scanner</button><p id="status" role="status"></p></form><p><a id="toggle" href="?mode=signup">Create an account</a></p><p>Use the same email to open your receipts on another device.</p></main><script>
(function(){var signup=new URLSearchParams(location.search).get('mode')==='signup';document.getElementById('title').textContent=signup?'Create your account':'Sign in';document.getElementById('name-field').hidden=!signup;document.getElementById('name').required=signup;document.getElementById('password').autocomplete=signup?'new-password':'current-password';document.getElementById('submit').textContent=signup?'Sign up & open scanner':'Sign in & open scanner';var toggle=document.getElementById('toggle');toggle.href=signup?'?mode=signin':'?mode=signup';toggle.textContent=signup?'Already have an account? Sign in':'Create an account';document.getElementById('show').onclick=function(){var p=document.getElementById('password');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Show':'Hide';};document.getElementById('account').onsubmit=async function(e){e.preventDefault();var button=document.getElementById('submit'),status=document.getElementById('status');button.disabled=true;status.textContent='Connecting…';try{var response=await fetch('https://reseats-production.up.railway.app/v1/account/'+(signup?'signup':'signin'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value,name:signup?document.getElementById('name').value:undefined})});var body=await response.json();if(!response.ok)throw new Error(body.error&&body.error.message||'Could not sign in.');localStorage.setItem('reseats_account_session',body.access_token);location.href='/vault.html?scan=1';}catch(err){status.textContent=err.message;}finally{button.disabled=false;}};})();
</script></html>

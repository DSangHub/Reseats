name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, feat/backend-pos-card-api]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reseats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reseats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reseats_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reseats_test
      ENCRYPTION_KEY: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
      API_KEY_PEPPER: ci-test-pepper
      SESSION_JWT_SECRET: ci-test-session-secret
      CARD_PROVIDERS: mock
      DEFAULT_CARD_PROVIDER: mock
      WEBHOOK_WORKER_ENABLED: false
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
